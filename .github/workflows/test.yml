# Builds GitFlux and runs the tests on every push and pull request, on Linux and Windows,
# with each Node version GitFlux supports. Tests run real git commands in temporary repositories.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.name "GitFlux CI" && git config --global user.email "ci@example.com" && git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run build
      - run: npm test
      # plugin/bin and plugin/ui are committed so installs need no build: fail if they're stale
      - name: Built plugin is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: git diff --exit-code --stat -- plugin/
